{% extends "templates/web.html" %}{% block page_content %}
<h1>Track your repair</h1>

<form method="get" class="my-4">
	<input
		type="text"
		name="code"
		class="form-control mb-2"
		placeholder="Tracking code"
		value="{{ code | e }}"
		required
	/>
	<button type="submit" class="btn btn-primary">Check status</button>
</form>

{% if found %}
<div class="card card-body">
	<p><b>Request:</b> {{ found.name }}</p>
	<p><b>Received on:</b> {{ frappe.format_date(found.creation) }}</p>
	<p><b>Status:</b> {{ job_state or found.status }}</p>
</div>
{% elif code %}
<p class="text-danger">No request found for that code.</p>
{% endif %} {% endblock %}
